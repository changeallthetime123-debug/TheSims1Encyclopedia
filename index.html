---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sims 1 Object Encyclopedia</title>
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
    <div class="sims-panel">
        <h1>The Sims 1 Object Catalog</h1>
        
        <div class="filter-bar">
            <label>Filter by Game: 
                <select id="expansionFilter">
                    <option value="all">All</option>
                    <option value="Base Game">Base Game</option>
                    <option value="Makin' Magic">Makin' Magic</option>
                    <option value="Hot Date">Hot Date</option>
                </select>
            </label>
        </div>

        <div class="object-grid" id="catalogGrid">
            {% for obj in site.objects %}
            <div class="sims-panel object-card" 
                 data-expansion="{{ obj.expansion }}"
                 data-title="{{ obj.title }}"
                 data-price="§{{ obj.price }}"
                 data-img="{{ obj.image | relative_url }}"
                 data-desc="{{ obj.description | default: '' }}">
                <img src="{{ obj.image | relative_url }}" alt="{{ obj.title }}">
                <h3>{{ obj.title }}</h3>
                <span class="price-tag">§{{ obj.price }}</span>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Modal Overlay -->
    <div id="object-modal" class="modal-overlay hidden">
        <div class="modal-content sims-panel">
            <button id="modal-close" class="modal-close">&times;</button>
            <img id="modal-img" src="" alt="" style="width: 150px; height: 150px; display: block; margin: 0 auto 15px;">
            <h2 id="modal-title"></h2>
            <p id="modal-price" class="price-tag"></p>
            <p id="modal-desc"></p>
        </div>
    </div>

    <script>
        // Filter logic
        const filterDropdown = document.getElementById('expansionFilter');
        const cards = document.querySelectorAll('.object-card');

        filterDropdown.addEventListener('change', function() {
            const selected = this.value;
            
            cards.forEach(card => {
                if (selected === 'all' || card.getAttribute('data-expansion') === selected) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        });

        // Modal logic
        const modal = document.getElementById('object-modal');
        const modalClose = document.getElementById('modal-close');
        const modalTitle = document.getElementById('modal-title');
        const modalPrice = document.getElementById('modal-price');
        const modalImg = document.getElementById('modal-img');
        const modalDesc = document.getElementById('modal-desc');

        cards.forEach(card => {
            card.addEventListener('click', () => {
                modalTitle.textContent = card.dataset.title;
                modalPrice.textContent = card.dataset.price;
                modalImg.src = card.dataset.img;
                modalImg.alt = card.dataset.title;
                modalDesc.textContent = card.dataset.desc;

                modal.classList.remove('hidden');
            });
        });

        const closeModal = () => modal.classList.add('hidden');

        modalClose.addEventListener('click', closeModal);

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
                closeModal();
            }
        });
    </script> 
</body>
</html>
