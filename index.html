<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Sims 1 Encyclopedia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>The Sims 1 Encyclopedia</h1>
  <p>Welcome to the catalog!</p>

  <h2>Catalog Items</h2>
  <ul>
    <!-- Jekyll will automatically generate a link for every item file you create -->
    {% for item in site.pages %}
      {% if item.layout == "item" %}
        <li>
          <a href="{{ item.url }}">{{ item.title }}</a> - §{{ item.price }}
        </li>
      {% endif %}
    {% endfor %}
  </ul>

</body>
</html>
